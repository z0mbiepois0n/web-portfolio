<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="pictures/favicon.ico">
    <title>About Me - Web & Mobile dev. portfolio</title>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Magra:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      .magra-regular {
        font-family: "Magra", sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      .magra-bold {
        font-family: "Magra", sans-serif;
        font-weight: 700;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Magra", sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      /* header */
      header {
        padding: 60px;
        text-align: center;
        background: #34070b;
        color: white;
      }

      .dropdown {
        position: relative;
        display: block;
        background-color: #4caf50;
      }

      /* Style the dropdown button */
      .dropbtn {
        background-color: #4caf50;
        color: white;
        padding: 16px;
        font-size: 16px;
        border: none;
        cursor: pointer;
      }

      /* Dropdown content */
      .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 200px;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
      }

      /* Links inside dropdown content */
      .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
      }

      /* Change color of dropdown links on hover */
      .dropdown-content a:hover {
        background-color: #f1f1f1;
      }
      /* Active link styling */
      .dropdown-content a.active {
        background-color: #2e7d32;
        color: white;
        font-weight: bold;
      }

      /* Show the dropdown content while hovering over the button or menu */
      .dropbtn:hover + .dropdown-content,
      .dropdown-content:hover {
        display: block;
      }

      /* Change background color of dropdown button on hover */
      .dropbtn:hover {
        background-color: #3e8e41;
      }

      /* Main content */
      .content {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f1f1f1;
      }

      /* Fake image, just for this example */
      .fakeimg {
        background-color: #aaa;
        width: 100%;
        padding: 20px;
      }

      /* Footer */
      footer {
        padding: 20px;
        text-align: center;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>Portfolio</h1>
      <p>Marlowe Mauer</p>
    </header>

    <!-- Navigation Bar -->
    <div class="dropdown">
      <button class="dropbtn">Dropdown Menu</button>
      <div class="dropdown-content">
        <a href="home.html">Home</a>
        <a href="about.html" class="active">About Me</a>
        <a href="link2.html">Link 2</a>
        <a href="link3.html">Link 3</a>
        <a href="link4.html">Link 4</a>
        <a href="link5.html">Link 5</a>
        <a href="link6.html">Link 6</a>
        <a href="link7.html">Link 7</a>
        <a href="link8.html">Link 8</a>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <h2>About Me</h2>
      <h5>Photo of me:</h5>
      <div class="fakeimg" style="height: 200px">Image</div>
      <p>Some text about me in culpa qui officia deserunt mollit anim..</p>
      <h3>More Text</h3>
      <p>Lorem ipsum dolor sit ame.</p>
      <div class="fakeimg" style="height: 60px">Image</div>
      <br />
      <div class="fakeimg" style="height: 60px">Image</div>
      <br />
      <div class="fakeimg" style="height: 60px">Image</div>
    </div>

    <!-- Footer -->
    <footer>
      <h2>Footer</h2>
    </footer>
  </body>
</html>
